<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageTitle">Qadam — история шага</title>
  <meta name="description" data-i18n-content="pageDesc" content="Вспомогательный инструмент для врача: сравнение походки ребёнка с ДЦП в условиях Baseline, Verbal и VR. Данные обрабатываются только в браузере.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23C7D93B'/%3E%3Cpath d='M13 12c5 0 6 5 5 9-1 4-1 6-1.5 8-.6 2-4.4 2-5 0-.6-2-.5-4-1.5-8-1-4 0-9 3-9z' fill='%2314213A'/%3E%3Ccircle cx='10.5' cy='7.5' r='2.4' fill='%2314213A'/%3E%3Ccircle cx='15' cy='6' r='1.9' fill='%2314213A'/%3E%3Ccircle cx='18.6' cy='7.4' r='1.5' fill='%2314213A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Фирменный след: одна форма, отражается для левой ноги -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="foot" viewBox="0 0 32 60">
      <path d="M15.5 21c7 0 9.5 7 8.3 14.5-1 6.3-1.6 11-2.6 16-1.2 5.6-9.4 5.6-10.6 0-1-5-1.4-9.6-2.6-15.5C6.4 28.4 8.6 21 15.5 21z"/>
      <ellipse cx="10.6" cy="13.6" rx="3.9" ry="4.6"/>
      <circle cx="16.8" cy="11.4" r="2.9"/>
      <circle cx="21.4" cy="12.9" r="2.4"/>
      <circle cx="24.9" cy="16" r="2"/>
      <circle cx="27.1" cy="20" r="1.7"/>
    </symbol>
  </svg>

  <header class="masthead">
    <div class="masthead__inner wrap">
      <a class="brand" href="#" id="brand-home" aria-label="Qadam — на главную" data-i18n-aria="homeLabel">
        <!-- логотип: цитрусовая плитка с тёмным следом (как иконка вкладки) -->
        <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="8" fill="var(--accent)"/>
          <use href="#foot" x="18" y="8" width="26" height="48" fill="var(--ink)"/>
        </svg>
        <span class="brand__name">Qadam</span>
      </a>
      <div class="masthead__text">
        <p class="masthead__tagline" data-i18n="tagline">История шага ребёнка</p>
        <p class="masthead__sub" data-i18n="subtitle"></p>
      </div>
      <div class="lang" role="group" aria-label="Язык / Тіл">
        <button type="button" class="lang__btn" data-lang="kz" aria-pressed="false">Қаз</button>
        <button type="button" class="lang__btn" data-lang="ru" aria-pressed="true">Рус</button>
      </div>
    </div>
    <nav class="topnav wrap" aria-label="Разделы" data-i18n-aria="navLabel">
      <a href="index.html" class="topnav__link" aria-current="page" data-i18n="navStory"></a>
      <a href="live.html" class="topnav__link" data-i18n="navLive"></a>
    </nav>
    <div class="trail" id="trail" aria-hidden="true"></div>
  </header>

  <p class="disclaimer wrap" role="note"><span data-i18n="disclaimer"></span></p>

  <main class="wrap" id="main">
    <!-- Экран 1: загрузка -->
    <section class="load" id="screen-load" aria-labelledby="drop-title">
      <div class="drop" id="drop" tabindex="0">
        <!-- смайлик в цитрусовом цвете (нарисован в SVG, не эмодзи) -->
        <svg class="drop__smile" viewBox="0 0 80 80" aria-hidden="true">
          <circle cx="40" cy="40" r="38" fill="var(--accent)"/>
          <ellipse cx="28" cy="32" rx="4.5" ry="6" fill="var(--ink)"/>
          <ellipse cx="52" cy="32" rx="4.5" ry="6" fill="var(--ink)"/>
          <path d="M22 47 Q40 64 58 47" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <span class="sec-no">01</span>
        <h1 class="drop__title" id="drop-title" data-i18n="dropTitle"></h1>
        <p class="drop__hint" data-i18n="dropHint"></p>
        <label class="btn btn--primary">
          <input type="file" id="file-input" accept=".csv,.json,text/csv,application/json" multiple hidden>
          <span data-i18n="choose"></span>
        </label>
        <p class="privacy"><strong data-i18n="privacyLead"></strong> <span data-i18n="privacy"></span></p>
      </div>

      <!-- Видно, только когда файлы запомнены в этом браузере -->
      <div class="saved" id="saved" hidden>
        <p data-i18n="savedNote"></p>
        <button type="button" class="btn" id="forget" data-i18n="forget"></button>
      </div>

      <div class="ledger" aria-labelledby="ledger-title">
        <h2 class="ledger__title" id="ledger-title" data-i18n="filesTitle"></h2>
        <table class="ledger__table">
          <thead>
            <tr><th></th><th scope="col">Baseline</th><th scope="col">Verbal</th><th scope="col">VR</th></tr>
          </thead>
          <tbody id="ledger-body"></tbody>
        </table>
        <ul class="messages" id="messages" aria-live="polite"></ul>
      </div>
    </section>

    <!-- Экран 1б: оглавление участников -->
    <section class="index" id="screen-index" hidden aria-labelledby="index-title">
      <header class="section-head">
        <div><span class="sec-no">02</span><h2 id="index-title" data-i18n="indexTitle"></h2></div>
        <p data-i18n="indexHint"></p>
      </header>
      <div class="ptable-wrap">
        <table class="ptable" id="ptable">
          <thead id="ptable-head"></thead>
          <tbody id="toc"></tbody>
        </table>
      </div>
    </section>

    <!-- Экран 2: история шага (заполняется из app.js) -->
    <section class="story" id="screen-story" hidden></section>
  </main>

  <footer class="colophon wrap">
    <p><strong data-i18n="disclaimer"></strong></p>
    <p data-i18n="privacy"></p>
    <p class="colophon__src" data-i18n="source"></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="story.js"></script>
  <script src="app.js"></script>
</body>
</html>
